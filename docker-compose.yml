version: '3.8'
services:
  frontend:
    build: ./frontend
    ports:
      - "5137:5137"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - "app.env"
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - "app.env"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17.6
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - "app.env"
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d swingdb"]
      interval: 2s
      retries: 10
volumes:
  postgres_data:
